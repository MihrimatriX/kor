# Her push / PR'da derlemenin bozulmadığını denetler.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build Kor.csproj -c Release
